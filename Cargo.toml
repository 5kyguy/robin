[package]
name = "robin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "File manager and media viewer for the R2-D2 desktop"
repository = "https://github.com/5kyguy/robin"
readme = "README.md"
rust-version = "1.99.1"

[dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
png = "0.17"
rustix = { version = "1", features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", features = ["unstable-winit-030"] }
thiserror = "2"
notify = { version = "8", default-features = false }

[build-dependencies]
slint-build = "=1.17.1"

[profile.dev]
debug = 0
